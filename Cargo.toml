[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/lunascope-core",
  "crates/lunascope-extensions",
  "crates/lunascope-integrations",
  "crates/lunascope-runtime",
  "crates/lunascope-storage",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
schemars = { version = "1.2.1", features = ["preserve_order"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
jiff = "0.2.23"
futures-util = "0.3.33"
base64 = "0.22.1"
deformat = { version = "=0.15.0", features = ["pdf"] }
flate2 = "1.1.5"
http = "1.3.1"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
office_oxide = "0.1.8"
rmcp = { version = "2.2.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
process-wrap = { version = "9.1.0", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }
pulldown-cmark = "0.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
sha2 = "0.11.0"
thiserror = "2.0.17"
tempfile = "3.27.0"
tar = "0.4.44"
tokio = { version = "1.52.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.19"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
uuid = { version = "1.24.0", features = ["v4"] }
url = "2.5.8"
zeroize = "1.9.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
