    .interrupt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--border);margin-top:12px}
    .interrupt-fact{padding:10px;background:var(--surface)}.interrupt-fact span{display:block;font:10px var(--font-mono);color:var(--muted);text-transform:uppercase}.interrupt-fact strong{display:block;margin-top:3px;font-size:12px}
    .artifact-evidence,.artifact-row-v14{display:grid;grid-template-columns:minmax(0,1fr) max-content;align-items:center;gap:18px;padding:12px 0;border-bottom:1px solid var(--border)}

    .mobile-only{display:none}
    .history-marker{width:7px;height:7px;border-radius:50%;background:var(--border-strong)}.history-row-v14.current .history-marker{background:var(--accent)}
    .run-attention{color:var(--accent)}
    .composer-attachments{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 0}.attachment-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 7px;border:1px solid var(--border);font:10px var(--font-mono);color:var(--muted);background:var(--surface-2)}
    .node.running:after{animation:none!important;transform:scaleX(.64);transition:transform .24s ease;background:var(--cyan)}

    @media(max-width:600px){.runtime-stack{gap:18px}.runtime-event-header{display:grid}.worker-activity-row{grid-template-columns:3px minmax(0,1fr);column-gap:10px}.worker-current,.worker-runtime{grid-column:2}.worker-runtime{grid-row:auto}.execution-lens-toggle{grid-template-columns:max-content minmax(0,1fr)}.lens-controls{grid-column:1/-1;justify-content:flex-end;border-top:1px solid var(--border);padding-top:7px}.lens-detail{grid-template-columns:1fr}.lens-metric{border-inline-end:0;border-bottom:1px solid var(--border)}}

  <script>
  (()=>{

    const orchestration={orchestrationId:'ORC-LS-0317',version:4,status:'running',source:'task-analysis',createdBy:'ORCH-01',planId:'PLAN-LS-0317',strategy:'Phased parallel delegation',decision:'multi-agent',rationaleSummary:'研究、实现与验证能够隔离，并通过结构化产物衔接。',estimatedDuration:'12–18 min',estimatedCost:'Medium',parallelism:2,maximumWorkers:6,orchestrator:{id:'ORCH-01',role:'Task Orchestrator',strategy:'Plan → delegate → verify → synthesize',phase:'PHASE 02 · Execution',activeWorkers:1,pendingResults:1,synthesis:'Waiting'},edges:[
      {id:'E1',from:'ORCH-01',to:'WK-01',type:'assignment',status:'consumed',label:'Reference brief'},

    function renderStatus(){$('#statusText').textContent=`ORCH-01 · ${orchestration.orchestrator.phase} · ${runtimeSelectors.active().length} active · ${runtimeSelectors.attention()} attention`;$('#approvalStatus').textContent=state.interrupt?.status==='pending'?'1 项审批':'无待处理审批';$('#approvalStatus').classList.toggle('run-attention',state.interrupt?.status==='pending');$('#themeToggle').textContent=state.theme==='light'?'深色':'浅色';document.body.classList.toggle('console-open',state.console);$('#consoleOutput').textContent='[10:02] RUN_STARTED          Scope approved\n[10:04] WORKER_CREATED       WK-03 Frontend Worker\n[10:07] HANDOFF_COMPLETED    migration-map.json → WK-03\n[10:11] INTERRUPT_CREATED    Browser verification · Medium risk\n\nTrace is hidden from Conversation by default.'}
    function renderTabs(){const hide=['orchestration','memory','integrations','settings'].includes(state.activeView),remaining=Math.max(0,state.changesReview.total-state.changesReview.accepted);$('.workspace').classList.toggle('special-view',hide);$('#tabs').classList.toggle('hidden',hide);$('#composer').classList.toggle('hidden',hide||state.activeView!=='conversation');const items=[['conversation','对话'],['plan','计划'],['changes','变更'],['agents','Workers'],['artifacts','交付物']];$('#tabs').innerHTML=items.map(([id,label])=>`<button class="tab ${state.activeView===id?'active':''}" role="tab" aria-selected="${state.activeView===id}" data-view="${id}">${label}${id==='changes'&&remaining?`<span class="badge">· ${remaining}</span>`:''}</button>`).join('')}
    function renderSidebar(){const attention=runtimeSelectors.attention()>0||!state.changesReview.reviewed;$('#threadList').innerHTML=threads.map(t=>{const hasAttention=t.id==='rebuild'?attention:t.attention;return `<button class="thread ${t.id===state.activeThread&&!['orchestration','memory','integrations','settings'].includes(state.activeView)?'active':''}" data-thread="${t.id}"><span class="dot ${t.status}"></span><span class="thread-main"><strong>${esc(t.title)}</strong><small>${esc(t.time)}</small></span>${hasAttention?'<i class="attention"></i>':''}</button>`}).join('')}

    function handleV14Click(e){
      const b=e.target.closest('[data-v14],[data-plan-edit],[data-add-worker]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();
      if(b.hasAttribute('data-plan-edit')){state.pendingPatch={worker:'PLAN-14',field:'Owner',from:'WK-03',to:'ORCH-01 + WK-03',summary:'Plan owner changed',impact:['No worker restart','Plan version increments','Conversation receives PLAN_UPDATED']};save();return showPatch()}
      if(b.hasAttribute('data-add-worker')){state.pendingPatch={worker:'WK-05',field:'Worker',from:'—',to:'Reviewer Worker',summary:'Add bounded review worker',impact:['Graph version increments','Estimated cost +8%','Verification phase gains one dependency']};save();return showPatch()}
      const a=b.dataset.v14;
      if(a==='toggle-lens'){state.lensExpanded=!state.lensExpanded;save();renderView();return}
      if(a==='toggle-complete'){state.showCompleteWorkers=!state.showCompleteWorkers;save();renderView();return}
      if(a==='toggle-run'){runtimeAdapter.dispatch({type:state.runStatus==='running'?'RUN_PAUSED':'RUN_RESUMED',title:state.runStatus==='running'?'Run paused':'Run resumed',summary:'User control'});return}
      if(a==='review-interrupt'){state.selected='interrupt';save();render();return}
      if(a==='allow-once'||a==='allow-run'){runtimeAdapter.resume(a==='allow-once'?'allow-once':'allow-run');return}
      if(a==='reject-interrupt'){state.interrupt.rejecting=true;save();renderView();return}
      if(a==='confirm-reject'){runtimeAdapter.resume('reject');return}
      if(a==='checkpoint'){runtimeAdapter.dispatch({type:'CHECKPOINT_CREATED',title:'Checkpoint created',summary:'CP-0317-03 · Run and workspace state saved'});return}
      if(a==='stop-run'){runtimeAdapter.dispatch({type:'RUN_STOPPED',title:'Run stopped',summary:'Worker processes stopped · outputs preserved'});return}
      if(a==='run-verification'){runtimeAdapter.dispatch({type:'VERIFICATION_UPDATED',title:'Verification started',summary:'Responsive · interaction · accessibility checks',payload:{status:'running',checks:{responsive:'running',interaction:'queued',accessibility:'queued'}}});setTimeout(()=>runtimeAdapter.dispatch({type:'VERIFICATION_UPDATED',title:'Verification completed',summary:'3 / 3 checks passed',payload:{status:'passed',checks:{responsive:'passed',interaction:'passed',accessibility:'passed'}}}),900);return}
      if(a==='select-file'){state.activeFile=b.dataset.file;state.mobileDiffOpen=true;save();renderView();return}
      if(a==='close-mobile-diff'){state.mobileDiffOpen=false;save();renderView();return}
      if(a==='accept-change'){runtimeAdapter.dispatch({type:'PATCH_APPLIED',title:'File accepted',summary:`${state.activeFile} · review state updated`,payload:{file:state.activeFile}});return}
      if(a==='revert-change'){runtimeAdapter.dispatch({type:'PATCH_REJECTED',title:'Change reverted',summary:`${state.activeFile} restored from CP-0317-02`,payload:{file:state.activeFile}});return}
      if(a==='run-history'){state.selected='history';save();render();return}
      if(a==='review-artifact'){state.selected=`artifact:${b.dataset.artifact}`;save();render();return}
      if(a==='toggle-worker'){const w=state.workers[state.selected];if(w)runtimeAdapter.dispatch({type:'WORKER_STATE_CHANGED',title:`${w.workerId} ${w.status==='running'?'paused':'resumed'}`,summary:w.task,payload:{workerId:w.workerId,status:w.status==='running'?'paused':'running'}});return}
      if(a==='edit-scope'){toast('Scope editor opened in review context');return}
    }
    function bindV14(){
      document.addEventListener('click',handleV14Click,true);
      $('#runAction').onclick=()=>{if(state.runStatus==='interrupted'){state.selected='interrupt';save();return render()}if(['complete','stopped'].includes(state.runStatus))return route('artifacts');runtimeAdapter.dispatch({type:state.runStatus==='running'?'RUN_PAUSED':'RUN_RESUMED',title:state.runStatus==='running'?'Run paused':'Run resumed',summary:'Header control'})};
      $('#newTask').onclick=()=>{const id=`thread-${Date.now()}`;threads.unshift({id,title:'新的任务',time:'刚刚',status:'waiting',attention:false});state.activeThread=id;state.activeView='conversation';state.events=[];save();route('conversation')};
      $('#moreMenu').onclick=()=>{state.selected='history';save();render()};
      $('#projectSwitch').onclick=()=>{state.selected='ORCH-01';state.inspectorTab='overview';save();render()};
      $$('[data-composer]').forEach(btn=>btn.onclick=()=>{const kind=btn.dataset.composer,input=$('#composerInput');if(kind==='attach'){if(!state.attachments.includes('scope-contract.md'))state.attachments.push('scope-contract.md');renderComposerState();save()}if(kind==='context'){input.value+=`${input.value?' ':''}@workspace `;input.focus()}if(kind==='command'){input.value+=`${input.value?' ':''}/checkpoint `;input.focus()}});
      $('#rewritePrompt').onclick=()=>{const id=$('#promptEditor').dataset.worker,w=state.workers[id];$('#promptEditor').value=`${workerPrompt(w.role,w.objective,w.expectedOutput)}\n\nREVISION NOTE\nPrefer deterministic, evidence-first execution.`;$('#promptOrigin').textContent='Candidate rewrite by ORCH-01';$('#promptOrigin').className='provenance'};
      $('#comparePrompt').onclick=()=>{const editor=$('#promptEditor');editor.classList.toggle('diff-mode');$('#comparePrompt').textContent=editor.classList.contains('diff-mode')?'退出比较':'比较'};
      $('#lockPrompt').onclick=()=>{const id=$('#promptEditor').dataset.worker,w=state.workers[id],locked=w.lockedFields.includes('prompt');w.lockedFields=locked?w.lockedFields.filter(x=>x!=='prompt'):[...w.lockedFields,'prompt'];$('#lockPrompt').textContent=locked?'锁定字段':'已锁定';save()};
      renderComposerState();
    }
    function renderComposerState(){const box=$('#composer .composer-box');if(!box)return;box.querySelector('.composer-attachments')?.remove();if(!state.attachments.length)return;box.insertAdjacentHTML('afterbegin',`<div class="composer-attachments">${state.attachments.map(x=>`<span class="attachment-chip">FILE · ${esc(x)}</span>`).join('')}</div>`)}

    bind();bindV14();syncRoute();
  })();
  </script>
</body>
</html>
