  <script>
  (()=>{
    'use strict';
    const KEY='lunascope-v16-clean-state';
    const workerPrompt=(role,objective,output)=>`ROLE\n${role}\n\nOBJECTIVE\n${objective}\n\nTASK\n完成分配给你的受限任务，不扩大范围。\n\nINPUTS\n项目文件、Plan Step 与 Orchestrator 提供的上下文。\n\nCONSTRAINTS\n遵守 Scope Contract；高风险操作必须请求审批。\n\nTOOLS\nFilesystem · Shell · Git\n\nOUTPUT CONTRACT\n${output}\n\nCOMPLETION CRITERIA\n输出可审阅、可验证，并附证据。\n\nFAILURE BEHAVIOR\n停止写入，保存 Checkpoint，并向 ORCH-01 报告。`;
    const defaults={theme:'dark',sidebar:true,console:false,activeView:'conversation',activeThread:null,orchMode:'blueprint',runStatus:'idle',delegation:'auto',selected:null,selectedNodes:[],selectedEdge:null,connectFrom:null,customEdges:[],hiddenEdges:[],reroutes:{},inspectorTab:'overview',zoom:.78,panX:36,panY:48,graphVersion:1,pendingPatch:null,events:[],threads:[],conversationEvents:{},positions:{},workers:{}};
    const orchestration={orchestrationId:null,version:1,status:'draft',source:null,createdBy:null,planId:null,strategy:null,decision:null,rationaleSummary:'',estimatedDuration:'',estimatedCost:'',parallelism:0,maximumWorkers:6,orchestrator:{id:'ORCH-01',role:'Task Orchestrator',strategy:null,phase:'Not started',activeWorkers:0,pendingResults:0,synthesis:'No run'},edges:[],phases:[],checkpoints:[],pendingPatch:null,createdAt:null,updatedAt:null};
    let state=load();const threads=state.threads;let drag=null;let toastTimer,eventRenderTimer;const undoStack=[],redoStack=[];
    let nativeRuntimeProjection={plan:null,result:null,changeSets:[],agentPlans:{},states:{}};
    let executionActivity=null;
    const conversationScroll={pinned:true,programmatic:false,lastView:null,lastThread:null};
    function isLegacySyntheticNarrative(event){if(String(event?.type||'')!=='assistant_message')return false;const text=String(event?.summary||'');return text.includes('已经完成第')&&text.includes('轮工具操作')||text.includes('正在执行下一项可观察操作')||text.includes('has completed tool round')||text.includes('is performing the next observable operation')}
    function cleanStoredRuntimeEvents(events){return (Array.isArray(events)?events:[]).filter(event=>!isLegacySyntheticNarrative(event)).map(event=>{if(String(event?.type||'')!=='agent_status'||!Array.isArray(event.trace))return event;const trace=event.trace.filter(step=>{const text=String(step?.summary||'');return !text.includes('正在检查第')&&!text.includes('Model is evaluating tool results')});return Object.assign({},event,{trace})})}
    function load(){try{
      const raw=JSON.parse(localStorage.getItem(KEY)||'null'),out=Object.assign(structuredClone(defaults),raw||{}, {workers:Object.assign(structuredClone(defaults.workers),raw?.workers||{})});
      out.selectedNodes=Array.isArray(out.selectedNodes)?out.selectedNodes:[];
      out.customEdges=Array.isArray(out.customEdges)?out.customEdges:[];
      out.hiddenEdges=Array.isArray(out.hiddenEdges)?out.hiddenEdges:[];
      out.reroutes=out.reroutes&&typeof out.reroutes==='object'?out.reroutes:{};
      out.threads=Array.isArray(out.threads)?out.threads:[];
      out.conversationEvents=out.conversationEvents&&typeof out.conversationEvents==='object'&&!Array.isArray(out.conversationEvents)?out.conversationEvents:{};
      Object.keys(out.conversationEvents).forEach(threadId=>out.conversationEvents[threadId]=cleanStoredRuntimeEvents(out.conversationEvents[threadId]));
      if(out.activeThread&&!out.threads.some(thread=>thread.id===out.activeThread))out.threads.unshift({id:out.activeThread,title:'已恢复的对话',time:'刚刚',status:'waiting',attention:false,projectId:null,runId:null});
      if(!out.activeThread&&out.threads.length)out.activeThread=out.threads[0].id;
      if(out.activeThread&&Array.isArray(out.conversationEvents[out.activeThread]))out.events=structuredClone(out.conversationEvents[out.activeThread]);else out.events=cleanStoredRuntimeEvents(out.events);
      return out
    }catch{return structuredClone(defaults)}}
    function boundedConversationEvents(events){let transient=0;return (Array.isArray(events)?events:[]).filter(event=>{if(['user_message','assistant_message'].includes(String(event?.type||'')))return true;transient++;return transient<=160})}
    function persistActiveConversation(){state.threads=threads;if(state.activeThread)state.conversationEvents[state.activeThread]=structuredClone(boundedConversationEvents(state.events))}
    function save(){try{persistActiveConversation();localStorage.setItem(KEY,JSON.stringify(state))}catch(error){console.error('Failed to persist lightweight UI projection; durable conversation storage remains authoritative.',error)}}
    function runtimeRunIdForThread(thread){
      if(!thread)return null;
      const events=thread.id===state.activeThread?state.events:state.conversationEvents[thread.id];
      const orchestrationEvent=(Array.isArray(events)?events:[]).find(event=>String(event?.id||'').startsWith('orchestration-run-run-'));
      return orchestrationEvent?String(orchestrationEvent.id).slice('orchestration-run-'.length):(thread.runId||null)
    }
    function activeConversationReference(thread){
      if(!thread)return null;
      const runId=runtimeRunIdForThread(thread);
      if(runId&&thread.runId!==runId){thread.runId=runId;save()}
      return {threadId:thread.id,runId,projectId:thread.projectId||null}
    }
    const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function markdownInline(value){
      const tokens=[];
      const token=html=>`@@LUNAMD${tokens.push(html)-1}@@`;
      let text=String(value??'');
      text=text.replace(/`([^`\n]+)`/g,(_,code)=>token(`<code>${esc(code)}</code>`));
      text=text.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g,(whole,label,href)=>{
        try{
          const url=new URL(href,location.origin);
          if(!['http:','https:','mailto:'].includes(url.protocol))return whole;
          const external=url.origin!==location.origin;
          return token(`<a href="${esc(url.href)}"${external?' target="_blank" rel="noopener noreferrer"':''}>${esc(label)}</a>`)
        }catch{return whole}
      });
      text=esc(text)
        .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
        .replace(/~~([^~\n]+)~~/g,'<del>$1</del>')
        .replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>');
      return text.replace(/@@LUNAMD(\d+)@@/g,(_,index)=>tokens[Number(index)]||'')
    }
    function markdown(value){
      const lines=String(value??'').replace(/\r\n?/g,'\n').split('\n');
      const output=[];
      const startsBlock=line=>/^```/.test(line)||/^(#{1,6})\s+/.test(line)||/^\s*([-*+]|\d+\.)\s+/.test(line)||/^>\s?/.test(line)||/^\s*---+\s*$/.test(line);
      for(let index=0;index<lines.length;){
        const line=lines[index];
        if(!line.trim()){index++;continue}
        const fence=line.match(/^```([A-Za-z0-9_-]*)\s*$/);
        if(fence){
          const code=[];index++;
          while(index<lines.length&&!/^```\s*$/.test(lines[index]))code.push(lines[index++]);
          if(index<lines.length)index++;
          output.push(`<pre><code${fence[1]?` class="language-${esc(fence[1])}"`:''}>${esc(code.join('\n'))}</code></pre>`);
          continue
        }
        const heading=line.match(/^(#{1,6})\s+(.+)$/);
        if(heading){const level=heading[1].length;output.push(`<h${level}>${markdownInline(heading[2])}</h${level}>`);index++;continue}
        if(/^\s*---+\s*$/.test(line)){output.push('<hr>');index++;continue}
        if(/^>\s?/.test(line)){
          const quote=[];
          while(index<lines.length&&/^>\s?/.test(lines[index]))quote.push(lines[index++].replace(/^>\s?/,''));
          output.push(`<blockquote>${quote.map(markdownInline).join('<br>')}</blockquote>`);
          continue
        }
        if(/^\s*[-*+]\s+/.test(line)){
          const items=[];
          while(index<lines.length){
            const item=lines[index].match(/^\s*[-*+]\s+(.+)$/);
            if(!item)break;
            items.push(`<li>${markdownInline(item[1])}</li>`);index++
          }
          output.push(`<ul>${items.join('')}</ul>`);
          continue
        }
        if(/^\s*\d+\.\s+/.test(line)){
          const items=[];
          while(index<lines.length){
            const item=lines[index].match(/^\s*\d+\.\s+(.+)$/);
            if(!item)break;
            items.push(`<li>${markdownInline(item[1])}</li>`);index++
          }
          output.push(`<ol>${items.join('')}</ol>`);
          continue
        }
        const paragraph=[];

        if(event.type==='INTERRUPT_CREATED'){

      if(kind==='worker'){const w=state.workers[id],primary=w?.status==='waiting-approval'?v14Button('Review approval','data-v14="review-interrupt"','ghost-btn'):v14Button(w?.status==='running'?'Pause':'Resume','data-v14="toggle-worker"','ghost-btn');return `<div class="contextual-actions">${primary}${v14Button('Open prompt',`data-open-prompt="${id}"`,'ghost-btn')}${v14Button('Locate in graph','data-open-orch','text-btn')}</div>`}
      if(kind==='interrupt')return `<div class="contextual-actions">${v14Button('Allow once','data-v14="allow-once"','primary-btn signal')}${v14Button('Edit scope','data-v14="edit-scope"','ghost-btn')}${v14Button('Reject','data-v14="reject-interrupt"','text-btn')}</div>`;
      return `<div class="contextual-actions">${v14Button('Open artifact','data-view="artifacts"','primary-btn')}${v14Button('View changes','data-view="changes"','ghost-btn')}${v14Button('Run verification','data-v14="run-verification"','text-btn')}</div>`;
    }
    function interruptInspector(){const i=state.interrupt;return `${contextualActions('interrupt',i.id)}<section class="inspect-section"><h3>RUNTIME INTERRUPT</h3><dl class="definition"><div><dt>Requester</dt><dd>${i.workerId} · ${i.title}</dd></div><div><dt>Action</dt><dd>${i.action}</dd></div><div><dt>Risk</dt><dd>${i.risk}</dd></div><div><dt>Scope</dt><dd>${i.scope}</dd></div><div><dt>Blast radius</dt><dd>${i.blastRadius}</dd></div><div><dt>Rollback</dt><dd>${i.rollback}</dd></div><div><dt>Recommendation</dt><dd>${i.recommendation}</dd></div></dl></section>`}
    function artifactInspector(name){return `${contextualActions('artifact',name)}<section class="inspect-section"><h3>ARTIFACT EVIDENCE</h3><dl class="definition"><div><dt>Artifact</dt><dd class="mono">${name}</dd></div><div><dt>Created by</dt><dd>WK-03 · Frontend Worker</dd></div><div><dt>Verification</dt><dd>${state.verification.status}</dd></div><div><dt>Responsive</dt><dd>${state.verification.checks.responsive}</dd></div><div><dt>Interaction</dt><dd>${state.verification.checks.interaction}</dd></div></dl></section>`}
    function runHistoryInspector(){return `<section class="inspect-section"><h3>RUN HISTORY</h3><div class="run-history-list">${state.runHistory.map(x=>`<button class="history-row-v14 control-reset ${x.status==='current'?'current':''}"><span class="mono">${x.time}</span><span class="history-marker"></span><span><strong>${esc(x.title)}</strong><small>${esc(x.detail)}</small></span><span>${x.status}</span></button>`).join('')}</div></section>`}
    function workerInspector(w,tab){
      if(tab==='prompt')return `<section class="inspect-section"><div class="runtime-event-header"><div><h3>WORKER PROMPT</h3><span class="provenance ${w.userOverrides.includes('prompt')?'user':''}">${w.userOverrides.includes('prompt')?'User override':'Generated by ORCH-01'} · v${w.promptVersion}</span></div>${v14Button('Open Prompt Studio',`data-open-prompt="${w.workerId}"`,'primary-btn')}</div><pre class="diff" style="margin-top:12px">${esc(w.prompt.slice(0,620))}${w.prompt.length>620?'\n…':''}</pre></section>`;
      if(tab==='permissions')return `<section class="inspect-section"><h3>PERMISSION POLICY</h3>${Object.entries(w.permissions).map(([k,v])=>`<div class="setting-row"><div><strong>${k}</strong><span class="provenance ${w.lockedFields.includes('permissions')?'user':''}">${w.lockedFields.includes('permissions')?'LOCKED BY USER':'Generated by Orchestrator'}</span></div><button class="ghost-btn" data-permission="${k}">${v}</button></div>`).join('')}</section>`;
      if(tab==='tools')return `<section class="inspect-section"><h3>TOOLS &amp; SKILLS</h3><dl class="definition"><div><dt>Tools</dt><dd>${w.tools.join(' · ')}</dd></div><div><dt>Skills</dt><dd>${w.skills.join(' · ')}</dd></div><div><dt>Selection reason</dt><dd>Required for ${w.phase} · selected by ORCH-01</dd></div></dl></section>`;
      if(tab==='context')return `<section class="inspect-section"><h3>INPUT CONTEXT</h3>${w.inputContext.map(x=>`<button class="interactive-row control-reset context-row"><span class="item-main"><strong class="item-title">${esc(x)}</strong><span class="item-description">Included · ${esc(w.contextPolicy)}</span></span><span class="status complete">Included</span></button>`).join('')}</section>`;
      if(tab==='output')return `<section class="inspect-section"><h3>OUTPUT CONTRACT</h3><dl class="definition"><div><dt>Artifact</dt><dd class="mono">${w.expectedOutput}</dd></div><div><dt>Schema</dt><dd>${w.outputSchema}</dd></div><div><dt>Completion</dt><dd>${w.completionCriteria}</dd></div><div><dt>Evidence</dt><dd>${state.verification.status}</dd></div></dl></section>`;
      if(tab==='runtime')return traceLens(w);
      if(tab==='history')return `<section class="inspect-section"><h3>CHANGE HISTORY</h3><div class="run-history-list"><button class="history-row-v14 control-reset"><span class="mono">10:08</span><span class="history-marker"></span><span><strong>Prompt v${w.promptVersion}</strong><small>${w.updatedBy} · structured update</small></span><span>current</span></button><button class="history-row-v14 control-reset"><span class="mono">10:04</span><span class="history-marker"></span><span><strong>Worker created</strong><small>${w.createdBy} · ${w.phase}</small></span><span>saved</span></button></div></section>`;
      return `<section class="inspect-section"><h3>ASSIGNMENT</h3><dl class="definition"><div><dt>Role</dt><dd>${w.role}</dd></div><div><dt>Objective</dt><dd>${w.objective}</dd></div><div><dt>Task</dt><dd>${w.task}</dd></div><div><dt>Phase</dt><dd>${w.phase}</dd></div><div><dt>Model</dt><dd>${w.model} ${w.lockedFields.includes('model')?'<span class="provenance user">LOCKED BY USER</span>':''}</dd></div><div><dt>Execution</dt><dd>${w.status}</dd></div><div><dt>Runtime health</dt><dd>${w.runtimeHealth}</dd></div></dl></section>`
    }
    function renderReview(){
      const pane=$('#review');if(!state.selected){pane.setAttribute('aria-hidden','true');return}pane.setAttribute('aria-hidden','false');
      const id=state.selected;
      if(id==='interrupt'){$('#reviewTitle').textContent='Approval Request';$('#reviewTabs').innerHTML='';$('#reviewBody').innerHTML=interruptInspector();return}
      if(id==='history'){$('#reviewTitle').textContent='Run History';$('#reviewTabs').innerHTML='';$('#reviewBody').innerHTML=runHistoryInspector();return}
      if(String(id).startsWith('artifact:')){const name=id.slice(9);$('#reviewTitle').textContent='Artifact Review';$('#reviewTabs').innerHTML='';$('#reviewBody').innerHTML=artifactInspector(name);return}
      const w=state.workers[id];$('#reviewTitle').textContent=id==='ORCH-01'?'Orchestrator Inspector':`${id} · Worker Inspector`;
      const tabs=id==='ORCH-01'?['overview','plan','strategy','runtime','history']:['overview','prompt','context','tools','permissions','output','runtime','history'];
      $('#reviewTabs').innerHTML=tabs.map(t=>`<button class="${state.inspectorTab===t?'active':''}" data-inspect-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');
      if(id==='ORCH-01')$('#reviewBody').innerHTML=orchestratorInspector();else $('#reviewBody').innerHTML=`${contextualActions('worker',id)}${state.inspectorTab==='runtime'?traceLens(w):workerInspector(w,state.inspectorTab)}`;
    }
    function renderHeader(){const orch=state.activeView==='orchestration';$('#headerTitle').textContent=orch?'LunaScope / Orchestration':'LunaScope / Unified Agent Workbench';$('#runStatus').className=`status ${state.runStatus}`;$('#runStatus').textContent=state.runStatus==='running'?'运行中':state.runStatus==='paused'?'已暂停':state.runStatus==='complete'?'已完成':state.runStatus==='stopped'?'已停止':state.runStatus==='interrupted'?'等待审批':'未运行';document.body.classList.toggle('run-paused',state.runStatus==='paused')}
    function renderStatus(){const english=document.documentElement.dataset.uiLanguage==='english',activity=executionActivity;if(activity){const worker=activity.workerId?`${activity.workerId} · `:'';$('#statusText').textContent=`${worker}${activity.role} · ${activity.state} · ${activity.detail}`;$('#statusText').classList.toggle('run-attention',Boolean(activity.running))}else{$('#statusText').textContent=english?'No active run':'尚无运行';$('#statusText').classList.remove('run-attention')}$('#approvalStatus').textContent=english?'No pending approvals':'无待处理审批';$('#approvalStatus').classList.remove('run-attention');$('#themeToggle').textContent=state.theme==='light'?(english?'Dark':'深色'):(english?'Light':'浅色');document.body.classList.toggle('console-open',state.console);$('#consoleOutput').textContent=''}
    function renderTabs(){const hide=['memory','integrations','settings'].includes(state.activeView),remaining=Math.max(0,state.changesReview.total-state.changesReview.accepted),english=document.documentElement.dataset.uiLanguage==='english';$('.workspace').classList.toggle('special-view',hide);$('#tabs').classList.toggle('hidden',hide);$('#composer').classList.toggle('hidden',hide||state.activeView!=='conversation');const items=english?[['conversation','Conversation'],['orchestration','Orchestration'],['plan','Plan'],['changes','Changes'],['agents','Workers'],['artifacts','Artifacts']]:[['conversation','对话'],['orchestration','编排'],['plan','计划'],['changes','变更'],['agents','子 Agent'],['artifacts','交付物']];$('#tabs').innerHTML=items.map(([id,label])=>`<button class="tab ${state.activeView===id?'active':''}" role="tab" aria-selected="${state.activeView===id}" data-view="${id}">${label}${id==='changes'&&remaining?`<span class="badge">· ${remaining}</span>`:''}</button>`).join('')}
    function renderSidebar(){const attention=runtimeSelectors.attention()>0||!state.changesReview.reviewed,english=document.documentElement.dataset.uiLanguage==='english';$('#threadList').innerHTML=threads.map(t=>{const hasAttention=t.id==='rebuild'?attention:t.attention,label=english?`Delete ${t.title}`:`删除 ${t.title}`;return `<div class="thread-row"><button class="thread ${t.id===state.activeThread&&!['memory','integrations','settings'].includes(state.activeView)?'active':''}" data-thread="${t.id}"><span class="dot ${t.status}"></span><span class="thread-main"><strong>${esc(t.title)}</strong><small>${esc(t.time)}</small></span>${hasAttention?'<i class="attention"></i>':''}</button><button class="thread-delete" type="button" data-delete-thread="${esc(t.id)}" aria-label="${esc(label)}" title="${esc(label)}">×</button></div>`}).join('')}

    function handleV14Click(e){
      const b=e.target.closest('[data-v14],[data-plan-edit],[data-add-worker]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();
      if(b.hasAttribute('data-plan-edit')){state.pendingPatch={worker:'PLAN-14',field:'Owner',from:'WK-03',to:'ORCH-01 + WK-03',summary:'Plan owner changed',impact:['No worker restart','Plan version increments','Conversation receives PLAN_UPDATED']};save();return showPatch()}
      if(b.hasAttribute('data-add-worker')){state.pendingPatch={worker:'WK-05',field:'Worker',from:'—',to:'Reviewer Worker',summary:'Add bounded review worker',impact:['Graph version increments','Estimated cost +8%','Verification phase gains one dependency']};save();return showPatch()}
      const a=b.dataset.v14;
      if(a==='toggle-lens'){state.lensExpanded=!state.lensExpanded;save();renderView();return}
      if(a==='toggle-complete'){state.showCompleteWorkers=!state.showCompleteWorkers;save();renderView();return}
      if(a==='toggle-run'){runtimeAdapter.dispatch({type:state.runStatus==='running'?'RUN_PAUSED':'RUN_RESUMED',title:state.runStatus==='running'?'Run paused':'Run resumed',summary:'User control'});return}
      if(a==='review-interrupt'){state.selected='interrupt';save();render();return}
      if(a==='allow-once'||a==='allow-run'){runtimeAdapter.resume(a==='allow-once'?'allow-once':'allow-run');return}
      if(a==='reject-interrupt'){state.interrupt.rejecting=true;save();renderView();return}
      if(a==='confirm-reject'){runtimeAdapter.resume('reject');return}
      if(a==='checkpoint'){runtimeAdapter.dispatch({type:'CHECKPOINT_CREATED',title:'Checkpoint created',summary:'CP-0317-03 · Run and workspace state saved'});return}
      if(a==='stop-run'){runtimeAdapter.dispatch({type:'RUN_STOPPED',title:'Run stopped',summary:'Worker processes stopped · outputs preserved'});return}
      if(a==='run-verification'){runtimeAdapter.dispatch({type:'VERIFICATION_UPDATED',title:'Verification started',summary:'Responsive · interaction · accessibility checks',payload:{status:'running',checks:{responsive:'running',interaction:'queued',accessibility:'queued'}}});setTimeout(()=>runtimeAdapter.dispatch({type:'VERIFICATION_UPDATED',title:'Verification completed',summary:'3 / 3 checks passed',payload:{status:'passed',checks:{responsive:'passed',interaction:'passed',accessibility:'passed'}}}),900);return}
      if(a==='select-file'){state.activeFile=b.dataset.file;state.mobileDiffOpen=true;save();renderView();return}
      if(a==='close-mobile-diff'){state.mobileDiffOpen=false;save();renderView();return}
      if(a==='accept-change'){runtimeAdapter.dispatch({type:'PATCH_APPLIED',title:'File accepted',summary:`${state.activeFile} · review state updated`,payload:{file:state.activeFile}});return}
      if(a==='revert-change'){runtimeAdapter.dispatch({type:'PATCH_REJECTED',title:'Change reverted',summary:`${state.activeFile} restored from CP-0317-02`,payload:{file:state.activeFile}});return}
      if(a==='run-history'){state.selected='history';save();render();return}
      if(a==='review-artifact'){state.selected=`artifact:${b.dataset.artifact}`;save();render();return}
      if(a==='toggle-worker'){const w=state.workers[state.selected];if(w)runtimeAdapter.dispatch({type:'WORKER_STATE_CHANGED',title:`${w.workerId} ${w.status==='running'?'paused':'resumed'}`,summary:w.task,payload:{workerId:w.workerId,status:w.status==='running'?'paused':'running'}});return}
      if(a==='edit-scope'){toast('Scope editor opened in review context');return}
    }
    function bindV14(){
      document.addEventListener('click',handleV14Click,true);
      $('#newTask').onclick=()=>{persistActiveConversation();const id=`thread-${Date.now()}`;threads.unshift({id,title:'等待首条消息',time:'刚刚',status:'waiting',attention:false,projectId:null,runId:null});state.activeThread=id;state.activeView='conversation';state.events=[];save();route('conversation')};
      $('#moreMenu').onclick=()=>{state.selected='history';save();render()};
      $('#projectSwitch').onclick=()=>{state.selected='ORCH-01';state.inspectorTab='overview';save();render()};
      $$('[data-composer]').forEach(btn=>btn.onclick=()=>{const kind=btn.dataset.composer,input=$('#composerInput');if(kind==='attach'){if(!state.attachments.includes('scope-contract.md'))state.attachments.push('scope-contract.md');renderComposerState();save()}if(kind==='context'){input.value+=`${input.value?' ':''}@workspace `;input.focus()}if(kind==='command'){input.value+=`${input.value?' ':''}/checkpoint `;input.focus()}});
      $('#rewritePrompt').onclick=()=>{const id=$('#promptEditor').dataset.worker,w=state.workers[id];$('#promptEditor').value=`${workerPrompt(w.role,w.objective,w.expectedOutput)}\n\nREVISION NOTE\nPrefer deterministic, evidence-first execution.`;$('#promptOrigin').textContent='Candidate rewrite by ORCH-01';$('#promptOrigin').className='provenance'};
      $('#comparePrompt').onclick=()=>{const editor=$('#promptEditor');editor.classList.toggle('diff-mode');$('#comparePrompt').textContent=editor.classList.contains('diff-mode')?'退出比较':'比较'};
      $('#lockPrompt').onclick=()=>{const id=$('#promptEditor').dataset.worker,w=state.workers[id],locked=w.lockedFields.includes('prompt');w.lockedFields=locked?w.lockedFields.filter(x=>x!=='prompt'):[...w.lockedFields,'prompt'];$('#lockPrompt').textContent=locked?'锁定字段':'已锁定';save()};
      renderComposerState();
    }
    function bindConversationScroll(){
      const view=$('#view');
      view.addEventListener('scroll',()=>{
        if(state.activeView!=='conversation'||conversationScroll.programmatic)return;
        conversationScroll.pinned=view.scrollHeight-view.scrollTop-view.clientHeight<96
      },{passive:true});
    }
    function renderComposerState(){const box=$('#composer .composer-box');if(!box)return;box.querySelector('.composer-attachments')?.remove();if(!state.attachments.length)return;box.insertAdjacentHTML('afterbegin',`<div class="composer-attachments">${state.attachments.map(x=>`<span class="attachment-chip">FILE · ${esc(x)}</span>`).join('')}</div>`)}

    bindConversationScroll();bind();bindV14();syncRoute();
  })();
  </script>
  <script type="module" src="/apps/desktop/src/runtime-native.ts"></script>
</body>
</html>
