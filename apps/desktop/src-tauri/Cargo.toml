[package]
name = "lunascope-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "lunascope_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64.workspace = true
deformat.workspace = true
include_dir = "0.7.4"
jiff.workspace = true
lunascope-core = { path = "../../../crates/lunascope-core" }
lunascope-extensions = { path = "../../../crates/lunascope-extensions" }
lunascope-integrations = { path = "../../../crates/lunascope-integrations" }
lunascope-runtime = { path = "../../../crates/lunascope-runtime" }
lunascope-storage = { path = "../../../crates/lunascope-storage" }
office_oxide.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tempfile.workspace = true
tokio.workspace = true
uuid.workspace = true
tokio-util.workspace = true
url.workspace = true
zip.workspace = true
